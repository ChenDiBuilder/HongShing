name: CI

# Green-suite gate (PRD-12 / SCRUM-75): the full backend pytest suite (including the
# SCRUM-71 Alembic drift gate) and all three SPA builds must pass on every PR/push.
# Set "Backend — pytest + Alembic drift gate" and the three "Build SPA" checks as
# required status checks on master in branch protection to enforce it.

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  backend-tests:
    name: Backend — pytest + Alembic drift gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hongshing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # conftest reads TEST_DATABASE_URL; the Alembic drift gate reads DATABASE_URL
      # and CREATE/DROPs throwaway databases via the admin `/postgres` connection.
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/hongshing_test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/hongshing_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend (with dev extras)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run full test suite
        working-directory: backend
        run: python -m pytest -q

  build-spas:
    name: Build SPA (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [customer-web, admin, storefront]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
        working-directory: ${{ matrix.app }}
      # SCRUM-216: lint gates all three SPAs (debt cleared in SCRUM-212 for
      # admin/storefront and in this story for customer-web) so it can't regrow.
      - run: npm run lint
        working-directory: ${{ matrix.app }}
      - run: npm run build
        working-directory: ${{ matrix.app }}
