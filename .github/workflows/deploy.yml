name: Deploy to prod

# ─────────────────────────────────────────────────────────────────────────────
# AUTO-DEPLOY ON MERGE TO main — INTENTIONALLY DISABLED FOR NOW.
#
# This mirrors deploy.sh --app-only: build + push the backend image to ECR
# (arm64 — the box is Graviton/t4g), build the three SPAs, rsync them to the box,
# and `docker compose up -d` over SSH. No terraform (no infra changes).
#
# TO FLIP IT ON when ready:
#   1. Uncomment the `push:` trigger below.
#   2. Uncomment the whole `deploy:` job.
#   3. Add the repo secrets listed at the bottom of the deploy job.
#   4. (Recommended) require the existing "CI" checks before this runs — e.g.
#      switch the trigger to `workflow_run` on CI success, or add branch
#      protection so main only advances through green CI.
#
# Until then this file only exposes a manual `workflow_dispatch` that reports the
# disabled state, so merging to main does NOT deploy.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
  # push:
  #   branches: [main]

jobs:
  disabled-notice:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Auto-deploy is DISABLED."
          echo "Uncomment the 'push' trigger and the 'deploy' job in"
          echo ".github/workflows/deploy.yml (and add the secrets) to enable."

