events {}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  gzip          on;
  gzip_types    text/css application/javascript application/json image/svg+xml;

  # Upstream FastAPI backend (the `backend` compose service, port 8001).
  upstream backend { server backend:8001; }

  # The single Let's Encrypt cert covers all three hosts; its live dir is named
  # after the FIRST -d passed to certbot (the customer host). Routing is by
  # server_name below.

  # ── Port 80: ACME challenge + redirect everything else to HTTPS ──
  server {
    listen 80;
    server_name hongshing.bridgewayinnovations.ca admin.hongshing.bridgewayinnovations.ca store.hongshing.bridgewayinnovations.ca;

    location /.well-known/acme-challenge/ { root /usr/share/nginx/html/customer; }
    location / { return 301 https://$host$request_uri; }
  }

  # Shared TLS for all server blocks below.
  # (set once; reused via include is overkill for 3 blocks, so repeated inline)

  # ── Customer signup landing ──
  server {
    listen 443 ssl;
    server_name hongshing.bridgewayinnovations.ca;
    ssl_certificate     /etc/letsencrypt/live/hongshing.bridgewayinnovations.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hongshing.bridgewayinnovations.ca/privkey.pem;

    root /usr/share/nginx/html/customer;
    index index.html;

    location /api/ {
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / { try_files $uri $uri/ /index.html; }
  }

  # ── Admin dashboard ──
  server {
    listen 443 ssl;
    server_name admin.hongshing.bridgewayinnovations.ca;
    ssl_certificate     /etc/letsencrypt/live/hongshing.bridgewayinnovations.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hongshing.bridgewayinnovations.ca/privkey.pem;

    root /usr/share/nginx/html/admin;
    index index.html;

    location /api/ {
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / { try_files $uri $uri/ /index.html; }
  }

  # ── Storefront (future native ordering) ──
  server {
    listen 443 ssl;
    server_name store.hongshing.bridgewayinnovations.ca;
    ssl_certificate     /etc/letsencrypt/live/hongshing.bridgewayinnovations.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hongshing.bridgewayinnovations.ca/privkey.pem;

    root /usr/share/nginx/html/store;
    index index.html;

    location /api/ {
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / { try_files $uri $uri/ /index.html; }
  }
}
