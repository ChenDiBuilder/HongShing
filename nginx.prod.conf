events {}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  gzip          on;
  gzip_types    text/css application/javascript application/json image/svg+xml;

  # Upstream FastAPI backend (the `backend` compose service, port 8001).
  upstream backend { server backend:8001; }

  # One host per restaurant under the demo namespace (PRD-11 / SCRUM-52):
  #   /        -> customer signup SPA  (vite base "/")
  #   /admin/  -> admin SPA            (vite base "/admin/")
  #   /store/  -> storefront SPA       (vite base "/store/")
  #   /api/    -> FastAPI backend
  # `__FQDN__` is rendered by deploy.sh from the box's fqdn (terraform output).
  # The SPAs live at /usr/share/nginx/html/{customer,admin,store}; root points at
  # html so the /admin/ and /store/ URL prefixes map straight to those dirs.

  # ── Port 80: ACME challenge + redirect to HTTPS ──
  server {
    listen 80;
    server_name __FQDN__;
    location /.well-known/acme-challenge/ { root /usr/share/nginx/html/customer; }
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 443 ssl;
    server_name __FQDN__;
    ssl_certificate     /etc/letsencrypt/live/__FQDN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__FQDN__/privkey.pem;

    location /api/ {
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin + storefront served under path prefixes (built with matching vite base).
    location /admin/ {
      root /usr/share/nginx/html;
      try_files $uri /admin/index.html;
    }
    location /store/ {
      root /usr/share/nginx/html;
      try_files $uri /store/index.html;
    }

    # Customer signup SPA at the root.
    location / {
      root /usr/share/nginx/html/customer;
      try_files $uri $uri/ /index.html;
    }
  }
}
