# Restaurant Profile — blank template (PRD-11)
#
# Copy to profiles/<slug>.yaml and fill in. One profile fully describes a new
# restaurant. See profiles/README.md for the field reference and the onboarding
# flow; validate against profiles/restaurant.schema.json.

identity:
  slug:                             # lowercase a-z0-9-, used for infra names + subdomain + DB
  name:                            # display name, e.g. "Pho 99"
  legal_name:
  domain:                          # default <slug>.demo.bridgewayinnovations.ca; customer domain at cutover

branding:
  # logo: either an absolute URL (served as-is) OR a path relative to profiles/
  # (the asset must exist under profiles/<path>; provision-restaurant.sh copies it
  # onto the box and serves it at /branding/<file>). Omit for a name-only header.
  logo: assets/<slug>/logo.png
  primary_color: "#000000"
  secondary_color: "#ffffff"
  copy:
    tagline:                       # home hero subtitle (falls back to a neutral default)
    reward_success:                # post-claim success line (falls back to a neutral default)

ordering:
  external_url:                    # existing online-ordering page to redirect to
  provider:                        # toast | square | ubereats | doordash | custom
  allow_without_signup: true

rewards:
  - name:
    type: percent                  # percent | fixed | freebie
    value: 10
    terms:

campaigns:                         # QR acquisition sources; headline/subtitle optional (QR landing copy)
  - source: table_tent
    headline:                      # e.g. "Grab a seat, grab a reward"
    subtitle:                      # e.g. "Join now and get 10% off your next order."
  - source: counter
  - source: receipt

storefront:
  enabled: false                   # native ordering — opt-in; requires a `menu:` block (see bottom)

sms:
  sender_id:                       # <= 11 chars where sender IDs are supported
  origination_number:              # provisioned per restaurant (CA long code in us-east-2)
  region: us-east-2
  templates:
    otp: "Your {restaurant} verification code is {code}. It expires in 5 minutes."
    reward: "{restaurant}: your reward is ready — {reward_code}. Order again: {ordering_url}"

locale:
  timezone: "America/Toronto"
  languages: [en]

compliance:
  privacy_contact_email:
  support_phone:                   # customer-facing support/contact phone
  business_mailing_address:        # required to send marketing SMS (CASL)

location:                          # customer-facing storefront display (optional; SPA falls back to neutral defaults)
  address:                         # pickup/display address, shown on home/cart/order pages
  phone:                           # main restaurant line for the home-page tel: link
  pickup_estimate:                 # e.g. "20–30 minutes"
  hours_display:                   # per-day display hours (distinct from hours.open/close below)
    Mon:
    Tue:
    Wed:
    Thu:
    Fri:
    Sat:
    Sun:

pricing:
  tax_rate: 0.13                   # sales-tax multiplier at cart (Ontario HST shown); SPA defaults to 0.13
  currency_symbol: "$"

hours:
  open: "11:00"
  close: "22:00"

owner:
  email:
  name:

# menu: native-storefront menu — required when storefront.enabled is true. One
# block per category; each item needs name + price (in dollars). image is optional:
# a filename under profiles/assets/<slug>/menu/ (copied to the box and served at
# /menu/items/<file>) or an absolute URL. description, tags (list), and popular
# (bool) are optional. Omit the whole section for redirect-only (external ordering) demos.
# menu:
#   - name: Starters
#     slug: starters
#     image: spring-roll.jpg
#     items:
#       - name: Spring Roll
#         price: 3
#         image: spring-roll.jpg
#         description: "Crispy vegetable spring roll"
#         tags: [Vegetarian]
#         popular: true
