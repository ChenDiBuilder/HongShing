# HongShing — reference Restaurant Profile (PRD-11)
#
# The canonical example of a "restaurant-in-a-box" profile. One profile fully
# describes a restaurant; the seeder (SCRUM-50) + provisioner (SCRUM-53) turn it
# into a live isolated clone. Fields marked TODO are owner-supplied and still
# unset for HongShing.
#
# Validate against profiles/restaurant.schema.json.

identity:
  slug: hongshing                 # lowercase, used for infra names + subdomain + DB
  name: "Hong Shing"
  legal_name: "Hong Shing Chinese Restaurant"     # TODO confirm
  # Demo default; swap to the customer's own domain at cutover.
  domain: hongshing.demo.bridgewayinnovations.ca

branding:
  logo: assets/hongshing/logo.svg   # Hong Shing logo (the order.hongshing.com mark; shipped in profiles/assets/hongshing/)
  primary_color: "#b91c1c"          # TODO confirm brand colors
  secondary_color: "#1f2937"
  copy:
    tagline: "Join our rewards — perks on every order."   # TODO confirm
    reward_success: "You're in! Here's your reward."

ordering:
  # No external_url: native in-app pickup ordering is enabled below (storefront.enabled),
  # so customers order via "Order Pickup" rather than being redirected off-site. The real
  # Hong Shing ordering site is order.hongshing.com (not hongshing.ca, which is parked) —
  # restore external_url only if an off-site delivery path is wanted alongside pickup.
  allow_without_signup: true

rewards:
  - name: "10% off your next order"   # TODO confirm the real offer
    type: percent                     # percent | fixed | freebie
    value: 10
    terms: "One per customer. Valid 30 days."

campaigns:                          # QR acquisition sources (headline/subtitle shown on the QR landing)
  - source: table_tent
    headline: "Grab a seat, grab a reward"
    subtitle: "You're at the table — join now and get 10% off your next Hong Shing order."
  - source: counter
    headline: "Welcome to Hong Shing"
    subtitle: "Join our rewards at the counter — 10% off your next order."
  - source: receipt
    headline: "Thanks for dining with us"
    subtitle: "Scan to claim 10% off your next Hong Shing order."

storefront:
  enabled: true                     # native ordering on (menu seeded from the `menu:` block below)

sms:
  sender_id: "Hong Shing"
  origination_number: "+12494218942"  # CA long code, provisioned in us-east-2 (out of sandbox)
  region: us-east-2
  templates:
    otp: "Your {restaurant} verification code is {code}. It expires in 5 minutes."
    reward: "{restaurant}: your reward is ready — {reward_code}. Order again: {ordering_url}"

locale:
  timezone: "America/Toronto"       # TODO confirm restaurant's actual timezone
  languages: [en]

compliance:
  privacy_contact_email: "privacy@hongshing.ca"   # PIPEDA contact (demo value)
  support_phone: "+1 416-555-0188"                # customer-facing support line (demo value)
  business_mailing_address: "195 Dundas St W, Toronto, ON M5G 1C7"   # CASL — registered mailing address

location:                           # customer-facing storefront display (PRD-12 S8)
  address: "195 Dundas St W, Toronto, ON M5G 1C7"
  phone: "+14169773338"             # main restaurant line (home-page tel: link)
  pickup_estimate: "20–30 minutes"
  hours_display:
    Mon: "11:30 AM – 9:00 PM"
    Tue: "Closed"
    Wed: "11:30 AM – 9:00 PM"
    Thu: "11:30 AM – 9:00 PM"
    Fri: "11:30 AM – 10:00 PM"
    Sat: "11:30 AM – 10:00 PM"
    Sun: "11:30 AM – 9:00 PM"

pricing:
  tax_rate: 0.13                    # Ontario HST
  currency_symbol: "$"

hours:                              # single-cron fallback for provision-restaurant.sh
  open: "11:30"                     # matches location.hours_display open time
  close: "22:00"                    # latest close across the week (Fri/Sat)
  # NOTE: HongShing's live schedule is PER-DAY and does not fit the single
  # open/close cron this block generates (stop differs 20:45 vs 21:45, closed Tue).
  # The live EventBridge Scheduler is managed out-of-band via CLI — 3 schedules:
  #   hongshing-start      cron(0 11 ? * SUN,MON,WED,THU,FRI,SAT *)  (30m before 11:30 open, excl. Tue)
  #   hongshing-stop       cron(45 20 ? * SUN,MON,WED,THU *)         (15m before 9pm close)
  #   hongshing-stop-late  cron(45 21 ? * FRI,SAT *)                 (15m before 10pm close)
  # All America/Toronto (DST-aware). See infra-ec2/schedule.tf header.

owner:
  email: "daniel.chen@bridgewayinnovations.ca"   # demo admin; add the restaurant owner's account at cutover
  name: "Daniel Chen"

