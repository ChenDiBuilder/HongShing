[project]
name = "hongshing-backend"
version = "0.1.0"
description = "HongShing customer capture and rewards platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115,<0.116",
    "uvicorn[standard]>=0.34,<0.35",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.14,<1.15",
    "pydantic-settings>=2.7,<2.8",
    "python-jose[cryptography]>=3.3,<3.4",
    "bcrypt>=5.0,<6.0",
    "python-multipart>=0.0.19,<0.1",
    "boto3>=1.37,<1.38",
    "httpx>=0.28,<0.29",
    "shortuuid>=1.0,<1.1",
    "click>=8.1,<9.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9,<0.10",
    "pytest>=8.3,<8.4",
    "pytest-asyncio>=0.25,<0.26",
    "httpx>=0.28,<0.29",
    "jsonschema>=4.0,<5.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
